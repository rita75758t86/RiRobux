<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RiRobux — Чат</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;

    color:#fff;

    background:

        radial-gradient(
            circle at 15% 15%,
            rgba(124,58,237,.30),
            transparent 28%
        ),

        radial-gradient(
            circle at 85% 75%,
            rgba(37,99,235,.22),
            transparent 30%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(168,85,247,.14),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #03040d,
            #090d22 45%,
            #070313
        );

    overflow-x:hidden;
}


/* =========================
   ЗВЁЗДЫ
========================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    z-index:-2;

    pointer-events:none;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.9) 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(196,181,253,.7) 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(147,197,253,.6) 1px,
            transparent 1.5px
        );

    background-size:
        90px 90px,
        150px 150px,
        230px 230px;

    background-position:
        0 0,
        40px 70px,
        120px 30px;

    animation:
        stars 35s linear infinite;
}


@keyframes stars{

    from{

        background-position:
            0 0,
            40px 70px,
            120px 30px;

    }

    to{

        background-position:
            90px 150px,
            190px 240px,
            350px 190px;

    }

}


/* =========================
   HEADER
========================= */

header{

    position:sticky;

    top:0;

    z-index:100;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        16px 6%;

    background:
        rgba(5,7,20,.78);

    border-bottom:
        1px solid
        rgba(167,139,250,.18);

    backdrop-filter:
        blur(20px);

}


.logo{

    color:#fff;

    text-decoration:none;

    font-size:28px;

    font-weight:900;

}


.logo span{

    color:#b57cff;

    text-shadow:
        0 0 25px
        rgba(124,58,237,.8);

}


.back-button{

    padding:
        10px 16px;

    border-radius:
        12px;

    color:#dddff2;

    text-decoration:none;

    background:
        rgba(255,255,255,.05);

    border:
        1px solid
        rgba(255,255,255,.10);

    transition:.25s;

}


.back-button:hover{

    color:#fff;

    border-color:
        rgba(167,139,250,.4);

    box-shadow:
        0 0 25px
        rgba(124,58,237,.15);

}


/* =========================
   CHAT
========================= */

.chat-wrapper{

    width:
        min(950px, calc(100% - 30px));

    margin:
        35px auto 50px;

}


.chat-card{

    overflow:hidden;

    border-radius:
        28px;

    background:
        rgba(11,14,38,.88);

    border:
        1px solid
        rgba(139,92,246,.28);

    box-shadow:

        0 35px 100px
        rgba(0,0,0,.5),

        0 0 70px
        rgba(124,58,237,.10);

    backdrop-filter:
        blur(20px);

}


/* =========================
   CHAT HEADER
========================= */

.chat-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:
        22px 25px;

    background:
        linear-gradient(
            135deg,
            rgba(124,58,237,.14),
            rgba(37,99,235,.08)
        );

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

}


.chat-title{

    display:flex;

    align-items:center;

    gap:12px;

}


.chat-icon{

    width:45px;

    height:45px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #2563eb
        );

    box-shadow:
        0 0 30px
        rgba(124,58,237,.4);

    font-size:21px;

}


.chat-title h1{

    font-size:21px;

}


.chat-title p{

    margin-top:4px;

    color:#7f88aa;

    font-size:12px;

}


.order-info{

    color:#aeb6d1;

    font-size:13px;

}


/* =========================
   MESSAGES
========================= */

.messages{

    height:
        570px;

    overflow-y:auto;

    padding:
        25px;

    scroll-behavior:smooth;

}


.messages::-webkit-scrollbar{

    width:7px;

}


.messages::-webkit-scrollbar-track{

    background:
        rgba(255,255,255,.02);

}


.messages::-webkit-scrollbar-thumb{

    border-radius:20px;

    background:
        rgba(139,92,246,.35);

}


.message-row{

    display:flex;

    margin-bottom:18px;

}


.message-row.user{

    justify-content:flex-end;

}


.message-row.admin{

    justify-content:flex-start;

}


.message{

    position:relative;

    max-width:
        min(650px, 78%);

    padding:
        15px 16px;

    border-radius:
        18px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(255,255,255,.045);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.15);

}


.message-row.user .message{

    border-bottom-right-radius:
        6px;

    background:
        linear-gradient(
            135deg,
            rgba(124,58,237,.38),
            rgba(37,99,235,.28)
        );

    border-color:
        rgba(167,139,250,.25);

}


.message-row.admin .message{

    border-bottom-left-radius:
        6px;

    background:
        rgba(20,24,56,.95);

}


.message-meta{

    display:flex;

    align-items:center;

    gap:8px;

    margin-bottom:7px;

    color:#878faa;

    font-size:11px;

}


.message-author{

    color:#cfc8ff;

    font-weight:bold;

}


.message-text{

    color:#f2f3fa;

    white-space:pre-wrap;

    line-height:1.55;

    word-break:break-word;

}


.message-time{

    margin-top:8px;

    color:#737b99;

    font-size:10px;

}


/* =========================
   КОСМИЧЕСКАЯ КНОПКА
========================= */

.cosmic-delete{

    position:absolute;

    top:8px;

    right:8px;

    width:31px;

    height:31px;

    display:flex;

    align-items:center;

    justify-content:center;

    border:0;

    border-radius:50%;

    color:#dcd5ff;

    background:

        radial-gradient(
            circle at 35% 30%,
            rgba(255,255,255,.35),
            transparent 20%
        ),

        radial-gradient(
            circle,
            rgba(124,58,237,.65),
            rgba(18,9,45,.95) 70%
        );

    cursor:pointer;

    opacity:0;

    transform:
        scale(.75)
        rotate(-15deg);

    transition:.25s;

    box-shadow:

        0 0 0
        rgba(124,58,237,0),

        inset 0 0 10px
        rgba(255,255,255,.08);

}


.message:hover
.cosmic-delete{

    opacity:1;

    transform:
        scale(1)
        rotate(0deg);

}


.cosmic-delete:hover{

    color:#fff;

    transform:
        scale(1.15)
        rotate(12deg);

    background:

        radial-gradient(
            circle at 35% 30%,
            rgba(255,255,255,.55),
            transparent 20%
        ),

        radial-gradient(
            circle,
            #8b5cf6,
            #24104f 72%
        );

    box-shadow:

        0 0 10px
        rgba(167,139,250,.8),

        0 0 25px
        rgba(124,58,237,.7),

        0 0 45px
        rgba(37,99,235,.35);

}


.cosmic-delete::after{

    content:"";

    position:absolute;

    width:5px;

    height:5px;

    top:4px;

    left:6px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        14px 3px 0 rgba(255,255,255,.7),
        17px 18px 0 rgba(196,181,253,.8),
        5px 21px 0 rgba(147,197,253,.6);

    opacity:.8;

}


.cosmic-delete:hover::after{

    animation:
        starsButton .8s ease infinite alternate;

}


@keyframes starsButton{

    from{
        opacity:.4;
        transform:scale(.8);
    }

    to{
        opacity:1;
        transform:scale(1.2);
    }

}


/* =========================
   INPUT
========================= */

.chat-input{

    display:flex;

    gap:10px;

    padding:
        18px;

    background:
        rgba(4,6,20,.55);

    border-top:
        1px solid
        rgba(255,255,255,.07);

}


.message-input{

    flex:1;

    min-width:0;

    resize:none;

    height:52px;

    padding:
        15px;

    border-radius:
        15px;

    outline:none;

    color:#fff;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(139,92,246,.25);

    font-size:15px;

}


.message-input:focus{

    border-color:
        #a78bfa;

    box-shadow:
        0 0 30px
        rgba(124,58,237,.15);

}


.send-button{

    width:
        58px;

    height:
        52px;

    border:0;

    border-radius:
        15px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #2563eb
        );

    cursor:pointer;

    font-size:19px;

    box-shadow:
        0 10px 30px
        rgba(124,58,237,.28);

    transition:.25s;

}


.send-button:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 15px 40px
        rgba(124,58,237,.45);

}


/* =========================
   LOADING / EMPTY
========================= */

.center-message{

    min-height:
        350px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    color:#858da9;

    line-height:1.7;

}


/* =========================
   MODAL
========================= */

.modal{

    position:fixed;

    inset:0;

    z-index:500;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:
        blur(10px);

}


.modal.active{

    display:flex;

}


.modal-box{

    width:100%;

    max-width:420px;

    padding:27px;

    text-align:center;

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            #141842,
            #090d28
        );

    border:
        1px solid
        rgba(167,139,250,.35);

    box-shadow:

        0 25px 80px
        rgba(0,0,0,.6),

        0 0 60px
        rgba(124,58,237,.18);

}


.modal-icon{

    width:60px;

    height:60px;

    display:flex;

    align-items:center;

    justify-content:center;

    margin:
        0 auto 17px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #7c3aed,
            #211040
        );

    box-shadow:
        0 0 35px
        rgba(124,58,237,.5);

    font-size:25px;

}


.modal-box h2{

    font-size:22px;

}


.modal-box p{

    margin-top:9px;

    color:#989fba;

    line-height:1.55;

}


.modal-buttons{

    display:flex;

    gap:10px;

    margin-top:22px;

}


.modal-buttons button{

    flex:1;

    padding:13px;

    border:0;

    border-radius:12px;

    cursor:pointer;

    font-weight:bold;

}


.modal-cancel{

    color:#ddd;

    background:
        rgba(255,255,255,.07);

}


.modal-confirm{

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #2563eb
        );

}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .chat-wrapper{

        width:
            calc(100% - 16px);

        margin-top:16px;

    }


    header{

        padding:
            14px 16px;

    }


    .logo{

        font-size:24px;

    }


    .chat-header{

        padding:
            17px;

    }


    .order-info{

        display:none;

    }


    .messages{

        height:
            62vh;

        padding:
            17px 12px;

    }


    .message{

        max-width:
            88%;

    }


    .chat-input{

        padding:
            12px;

    }


    .message-input{

        height:
            48px;

    }


    .send-button{

        width:
            50px;

        height:
            48px;

    }

}

</style>

</head>


<body>


<header>

    <a
        href="profile.html"
        class="logo"
    >
        Ri<span>Robux</span>
    </a>


    <a
        href="profile.html"
        class="back-button"
    >
        ← Профиль
    </a>

</header>


<main class="chat-wrapper">

    <div class="chat-card">


        <div class="chat-header">

            <div class="chat-title">

                <div class="chat-icon">
                    💬
                </div>

                <div>

                    <h1>
                        Чат с продавцом
                    </h1>

                    <p>
                        RiRobux Support
                    </p>

                </div>

            </div>


            <div
                class="order-info"
                id="orderInfo"
            >
                Заказ загружается...
            </div>

        </div>


        <div
            class="messages"
            id="messages"
        >

            <div class="center-message">
                Загрузка сообщений...
            </div>

        </div>


        <div class="chat-input">

            <textarea
                id="messageInput"
                class="message-input"
                placeholder="Напишите сообщение..."
            ></textarea>


            <button
                id="sendButton"
                class="send-button"
                type="button"
            >
                🚀
            </button>

        </div>

    </div>

</main>


<!-- =========================
     MODAL
========================= -->

<div
    class="modal"
    id="deleteModal"
>

    <div class="modal-box">

        <div class="modal-icon">
            🌌
        </div>

        <h2>
            Удалить сообщение?
        </h2>

        <p>
            Сообщение исчезнет из этого чата.
        </p>


        <div class="modal-buttons">

            <button
                class="modal-cancel"
                id="cancelDelete"
            >
                Отмена
            </button>


            <button
                class="modal-confirm"
                id="confirmDelete"
            >
                ✨ Удалить
            </button>

        </div>

    </div>

</div>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );


const orderId =
    params.get("order");


const isAdmin =
    params.get("admin") === "true";


const userToken =
    localStorage.getItem(
        "rirobuxAuthToken"
    );


const adminToken =
    localStorage.getItem(
        "rirobuxAdminToken"
    );


const token =
    isAdmin
        ? adminToken
        : userToken;


const messagesBox =
    document.getElementById(
        "messages"
    );


const input =
    document.getElementById(
        "messageInput"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


const orderInfo =
    document.getElementById(
        "orderInfo"
    );


const deleteModal =
    document.getElementById(
        "deleteModal"
    );


const cancelDelete =
    document.getElementById(
        "cancelDelete"
    );


const confirmDelete =
    document.getElementById(
        "confirmDelete"
    );


let messageToDelete =
    null;


let currentOrder =
    null;


/* =========================================
   ПРОВЕРКА
========================================= */

if (
    !orderId
) {

    messagesBox.innerHTML =
        `
        <div class="center-message">
            ❌ Заказ не указан.
        </div>
        `;

    sendButton.disabled =
        true;

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================
   ЗАГРУЗКА ЗАКАЗА
========================================= */

async function loadOrder(){

    if (!orderId) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/users/" +
                encodeURIComponent(
                    orderId
                ),
                {
                    headers:
                        token
                        ? {
                            "Authorization":
                                "Bearer " +
                                token
                        }
                        : {}
                }
            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                data.error ||
                "Не удалось загрузить заказ"
            );

        }


        currentOrder =
            data;


        orderInfo.textContent =
            "Заказ #" +
            (
                data.orderNumber ||
                "—"
            );


        renderMessages(
            data.messages || []
        );

    } catch(error) {

        messagesBox.innerHTML =
            `
            <div class="center-message">
                ❌ ${escapeHtml(
                    error.message
                )}
            </div>
            `;

    }

}


/* =========================================
   СООБЩЕНИЯ
========================================= */

function renderMessages(
    messages
){

    if (
        !messages.length
    ) {

        messagesBox.innerHTML =
            `
            <div class="center-message">

                🌌 Здесь пока нет сообщений.

                <br>

                Напишите первым!

            </div>
            `;

        return;

    }


    messagesBox.innerHTML =
        "";


    messages.forEach(
        message => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "message-row " +
                (
                    message.sender ===
                    "user"
                        ? "user"
                        : "admin"
                );


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message";


            const author =
                message.sender ===
                    "user"
                    ? "Вы"
                    : (
                        message.isBot
                            ? "🤖 RiBot"
                            : "👑 Продавец"
                    );


            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.type =
                "button";


            deleteButton.className =
                "cosmic-delete";


            deleteButton.title =
                "Удалить сообщение";


            deleteButton.setAttribute(
                "aria-label",
                "Удалить сообщение"
            );


            deleteButton.innerHTML =
                "✦";


            deleteButton.addEventListener(
                "click",
                () => {

                    openDeleteModal(
                        message.id
                    );

                }
            );


            bubble.innerHTML =
                `
                <div class="message-meta">

                    <span class="message-author">
                        ${escapeHtml(
                            author
                        )}
                    </span>

                </div>

                <div class="message-text">
                    ${escapeHtml(
                        message.text
                    )}
                </div>

                <div class="message-time">
                    ${escapeHtml(
                        message.createdAt ||
                        ""
                    )}
                </div>
                `;


            /*
            Кнопку удаления показываем
            на всех сообщениях,
            доступ проверяет сервер.
            */

            bubble.appendChild(
                deleteButton
            );


            row.appendChild(
                bubble
            );


            messagesBox.appendChild(
                row
            );

        }
    );


    messagesBox.scrollTop =
        messagesBox.scrollHeight;

}


/* =========================================
   ОТКРЫТЬ ОКНО УДАЛЕНИЯ
========================================= */

function openDeleteModal(
    messageId
){

    messageToDelete =
        messageId;

    deleteModal.classList.add(
        "active"
    );

}


/* =========================================
   ЗАКРЫТЬ ОКНО
========================================= */

function closeDeleteModal(){

    messageToDelete =
        null;

    deleteModal.classList.remove(
        "active"
    );

}


cancelDelete.addEventListener(
    "click",
    closeDeleteModal
);


/* =========================================
   УДАЛЕНИЕ
========================================= */

confirmDelete.addEventListener(
    "click",
    async () => {

        if (
            !messageToDelete ||
            !orderId
        ) {

            closeDeleteModal();

            return;

        }


        confirmDelete.disabled =
            true;


        confirmDelete.textContent =
            "Удаляем...";


        try {

            const response =
                await fetch(
                    "/api/users/" +
                    encodeURIComponent(
                        orderId
                    ) +
                    "/messages/" +
                    encodeURIComponent(
                        messageToDelete
                    ),
                    {
                        method:
                            "DELETE",

                        headers:
                            token
                            ? {
                                "Authorization":
                                    "Bearer " +
                                    token
                            }
                            : {}
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok
            ) {

                throw new Error(
                    data.error ||
                    "Не удалось удалить сообщение"
                );

            }


            closeDeleteModal();


            await loadOrder();


        } catch(error) {

            alert(
                "❌ " +
                error.message
            );

        } finally {

            confirmDelete.disabled =
                false;

            confirmDelete.textContent =
                "✨ Удалить";

        }

    }
);


/* =========================================
   ОТПРАВКА
========================================= */

async function sendMessage(){

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    if (!token) {

        alert(
            "Необходимо войти в аккаунт."
        );

        return;

    }


    sendButton.disabled =
        true;


    try {

        const response =
            await fetch(
                "/api/users/" +
                encodeURIComponent(
                    orderId
                ) +
                "/messages",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token

                    },

                    body:
                        JSON.stringify({

                            text

                        })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                data.error ||
                "Не удалось отправить сообщение"
            );

        }


        input.value =
            "";


        await loadOrder();


    } catch(error) {

        alert(
            "❌ " +
            error.message
        );

    } finally {

        sendButton.disabled =
            false;

    }

}


sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================
   ENTER
========================================= */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================
   ОБНОВЛЕНИЕ
========================================= */

let loading =
    false;


async function refreshChat(){

    if (
        loading ||
        !orderId
    ) {

        return;

    }


    loading =
        true;


    try {

        const response =
            await fetch(
                "/api/users/" +
                encodeURIComponent(
                    orderId
                ),
                {
                    headers:
                        token
                        ? {
                            "Authorization":
                                "Bearer " +
                                token
                        }
                        : {}
                }
            );


        if (
            response.ok
        ) {

            const data =
                await response.json();


            currentOrder =
                data;


            renderMessages(
                data.messages || []
            );

        }

    } catch {

        /*
        Не показываем ошибку
        при автоматическом обновлении.
        */

    } finally {

        loading =
            false;

    }

}


setInterval(
    refreshChat,
    4000
);


/* =========================================
   START
========================================= */

loadOrder();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Чат с продавцом — RiRobux</title>


    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            margin: 0;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(124, 58, 237, 0.28),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 70%,
                    rgba(37, 99, 235, 0.22),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 50% 100%,
                    rgba(168, 85, 247, 0.15),
                    transparent 40%
                ),

                linear-gradient(
                    135deg,
                    #050816,
                    #101636,
                    #09061a
                );

            background-attachment: fixed;
        }


        /* ЗВЁЗДЫ */

        body::before {
            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background-image:

                radial-gradient(
                    circle,
                    white 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle,
                    rgba(196, 181, 253, 0.8) 1px,
                    transparent 1.5px
                );

            background-size:
                80px 80px,
                130px 130px;

            background-position:
                0 0,
                40px 60px;

            opacity: 0.45;

            animation:
                starsMove 25s linear infinite;

            z-index: -1;
        }


        @keyframes starsMove {

            from {

                background-position:
                    0 0,
                    40px 60px;

            }

            to {

                background-position:
                    80px 120px,
                    120px 180px;

            }

        }


        /* ШАПКА */

        header {

            padding: 16px 6%;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            background:
                rgba(8, 12, 35, 0.85);

            border-bottom:
                1px solid
                rgba(139, 92, 246, 0.35);

            backdrop-filter:
                blur(18px);

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .logo {

            color: white;

            text-decoration: none;

            font-size: 28px;

            font-weight: bold;

            text-shadow:
                0 0 20px
                rgba(124, 58, 237, 0.5);

        }


        .logo span {

            color: #b57cff;

            text-shadow:
                0 0 15px
                #7c3aed;

        }


        .back {

            padding: 11px 18px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );

            color: white;

            text-decoration: none;

            font-weight: bold;

            transition:
                transform 0.2s,
                box-shadow 0.2s;

        }


        .back:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 0 25px
                rgba(124, 58, 237, 0.45);

        }


        /* ОСНОВНОЙ БЛОК */

        main {

            max-width: 850px;

            margin: 40px auto;

            padding: 20px;

        }


        .chat-card {

            padding: 28px;

            border-radius: 26px;

            background:
                rgba(16, 20, 55, 0.82);

            border:
                1px solid
                rgba(139, 92, 246, 0.35);

            box-shadow:

                0 0 40px
                rgba(76, 29, 149, 0.18),

                0 30px 80px
                rgba(0, 0, 0, 0.35);

            backdrop-filter:
                blur(18px);

        }


        /* ВЕРХ ЧАТА */

        .chat-header {

            display: flex;

            align-items: center;

            gap: 15px;

            padding-bottom: 20px;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.08);

        }


        .seller-avatar {

            width: 52px;

            height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 18px;

            font-size: 25px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );

            box-shadow:
                0 0 25px
                rgba(124, 58, 237, 0.45);

        }


        .seller-info {

            flex: 1;

        }


        .seller-info h1 {

            margin: 0;

            font-size: 21px;

        }


        .seller-status {

            margin-top: 5px;

            color: #a8f0c6;

            font-size: 13px;

        }


        .order-info {

            margin-top: 20px;

            padding: 15px;

            border-radius: 16px;

            color: #c7cce5;

            line-height: 1.7;

            background:
                rgba(7, 10, 30, 0.5);

            border:
                1px solid
                rgba(139, 92, 246, 0.18);

        }


        .order-info b {

            color: white;

        }


        /* СООБЩЕНИЯ */

        #messages {

            height: 430px;

            overflow-y: auto;

            margin-top: 20px;

            padding: 18px;

            border-radius: 20px;

            background:
                rgba(7, 10, 30, 0.55);

            border:
                1px solid
                rgba(139, 92, 246, 0.2);

            scroll-behavior: smooth;

        }


        #messages::-webkit-scrollbar {

            width: 7px;

        }


        #messages::-webkit-scrollbar-thumb {

            border-radius: 20px;

            background:
                rgba(139, 92, 246, 0.5);

        }


        .message {

            max-width: 78%;

            width: fit-content;

            padding: 13px 16px;

            margin: 10px 0;

            border-radius: 18px;

            line-height: 1.5;

            word-break: break-word;

            background:
                rgba(37, 43, 85, 0.85);

            border:
                1px solid
                rgba(255, 255, 255, 0.06);

        }


        /* МОИ СООБЩЕНИЯ */

        .user-message {

            margin-left: auto;

            background:
                linear-gradient(
                    135deg,
                    rgba(124, 58, 237, 0.85),
                    rgba(37, 99, 235, 0.8)
                );

            box-shadow:
                0 5px 20px
                rgba(124, 58, 237, 0.2);

        }


        /* СООБЩЕНИЯ ПРОДАВЦА */

        .admin-message {

            margin-right: auto;

            background:
                rgba(30, 36, 75, 0.9);

        }


        .message-author {

            display: block;

            margin-bottom: 5px;

            font-size: 12px;

            font-weight: bold;

            color: #c4b5fd;

        }


        .message-time {

            display: block;

            margin-top: 7px;

            font-size: 11px;

            opacity: 0.6;

        }


        /* ОТПРАВКА */

        .send-area {

            display: flex;

            gap: 10px;

            margin-top: 18px;

        }


        #messageInput {

            flex: 1;

            padding: 15px 18px;

            border-radius: 15px;

            border:
                1px solid
                rgba(139, 92, 246, 0.35);

            outline: none;

            color: white;

            font-size: 15px;

            background:
                rgba(7, 10, 30, 0.7);

            transition:
                border 0.2s,
                box-shadow 0.2s;

        }


        #messageInput::placeholder {

            color: #777b9c;

        }


        #messageInput:focus {

            border-color:
                #a78bfa;

            box-shadow:
                0 0 20px
                rgba(124, 58, 237, 0.25);

        }


        #sendButton {

            border: none;

            padding: 15px 22px;

            border-radius: 15px;

            color: white;

            font-weight: bold;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );

            transition:
                transform 0.2s,
                box-shadow 0.2s;

        }


        #sendButton:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 0 25px
                rgba(124, 58, 237, 0.45);

        }


        #sendButton:disabled {

            opacity: 0.5;

            cursor: not-allowed;

            transform: none;

        }


        /* ОШИБКА */

        .error {

            padding: 30px;

            text-align: center;

            color: #fca5a5;

        }


        .empty {

            padding: 40px 20px;

            text-align: center;

            color: #a8adc9;

        }


        /* МОБИЛЬНАЯ ВЕРСИЯ */

        @media (max-width: 600px) {

            header {

                padding: 15px 16px;

            }


            .logo {

                font-size: 22px;

            }


            .back {

                padding: 10px 13px;

                font-size: 13px;

            }


            main {

                margin: 20px auto;

                padding: 12px;

            }


            .chat-card {

                padding: 17px;

                border-radius: 22px;

            }


            #messages {

                height: 55vh;

                min-height: 350px;

            }


            .send-area {

                flex-direction: column;

            }


            #sendButton {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<header>

    <a
        href="profile.html"
        class="logo"
    >
        Ri<span>Robux</span>
    </a>


    <a
        href="profile.html"
        class="back"
    >
        ← К профилю
    </a>

</header>


<main>


    <div class="chat-card">


        <div class="chat-header">

            <div class="seller-avatar">
                🛸
            </div>


            <div class="seller-info">

                <h1>
                    Чат с продавцом
                </h1>


                <div class="seller-status">
                    ● Продавец на связи
                </div>

            </div>

        </div>


        <div
            class="order-info"
            id="orderInfo"
        >
            Загрузка информации о заказе...
        </div>


        <div
            id="messages"
        >

            <div class="empty">
                Загрузка сообщений...
            </div>

        </div>


        <div class="send-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Напишите сообщение продавцу..."
                autocomplete="off"
            >


            <button
                id="sendButton"
                type="button"
            >
                🚀 Отправить
            </button>

        </div>


    </div>


</main>


<script>

    let currentOrder = null;

    let lastMessagesJson = "";


    /* ПОЛУЧАЕМ ID ЗАКАЗА ИЗ ССЫЛКИ */

    function getOrderId() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        return params.get("order");

    }


    /* ЗАГРУЖАЕМ ЗАКАЗ */

    async function loadOrder() {

        const orderId =
            getOrderId();


        if (!orderId) {

            document.getElementById(
                "orderInfo"
            ).innerHTML =
                `
                <div class="error">
                    ❌ Заказ не выбран
                </div>
                `;

            return;

        }


        try {

            const response =
                await fetch(
                    "/api/users/" +
                    encodeURIComponent(
                        orderId
                    )
                );


            const order =
                await response.json();


            if (
                !response.ok ||
                order.error
            ) {

                document.getElementById(
                    "orderInfo"
                ).innerHTML =
                    `
                    <div class="error">
                        ❌ Заказ не найден
                    </div>
                    `;

                return;

            }


            currentOrder =
                order;


            renderOrderInfo();


            renderMessages();

        } catch (error) {

            console.error(error);


            document.getElementById(
                "orderInfo"
            ).innerHTML =
                `
                <div class="error">
                    ❌ Ошибка загрузки заказа
                </div>
                `;

        }

    }


    /* ИНФОРМАЦИЯ О ЗАКАЗЕ */

    function renderOrderInfo() {

        if (!currentOrder) {
            return;
        }


        document.getElementById(
            "orderInfo"
        ).innerHTML =
            `
            <b>
                🚀 Заказ #${escapeHtml(
                    String(
                        currentOrder.orderNumber || "—"
                    )
                )}
            </b>

            <br>

            👤 <b>Roblox:</b>
            ${escapeHtml(
                currentOrder.username ||
                "Не указан"
            )}

            <br>

            💎 <b>Robux:</b>
            ${Number(
                currentOrder.robux || 0
            ).toLocaleString(
                "ru-RU"
            )}

            <br>

            📌 <b>Статус:</b>
            ${escapeHtml(
                currentOrder.status ||
                "Новая заявка"
            )}
            `;

    }


    /* ВЫВОД СООБЩЕНИЙ */

    function renderMessages() {

        const messagesBox =
            document.getElementById(
                "messages"
            );


        const messages =
            Array.isArray(
                currentOrder.messages
            )
                ? currentOrder.messages
                : [];


        const currentJson =
            JSON.stringify(
                messages
            );


        /*
        Если сообщения не изменились,
        не перерисовываем чат.
        */

        if (
            currentJson ===
            lastMessagesJson
        ) {
            return;
        }


        lastMessagesJson =
            currentJson;


        messagesBox.innerHTML =
            "";


        if (
            messages.length === 0
        ) {

            messagesBox.innerHTML =
                `
                <div class="empty">
                    🛸 Сообщений пока нет.<br>
                    Напиши продавцу первым!
                </div>
                `;

            return;

        }


        messages.forEach(
            message => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "message";


                /*
                admin = продавец
                user = покупатель
                */

                if (
                    message.sender ===
                    "admin"
                ) {

                    div.classList.add(
                        "admin-message"
                    );

                } else {

                    div.classList.add(
                        "user-message"
                    );

                }


                const sender =
                    message.sender ===
                    "admin"
                        ? "🛸 Продавец"
                        : "👤 Вы";


                div.innerHTML =
                    `
                    <span class="message-author">
                        ${sender}
                    </span>

                    ${escapeHtml(
                        message.text
                    )}

                    <span class="message-time">
                        ${escapeHtml(
                            message.createdAt ||
                            ""
                        )}
                    </span>
                    `;


                messagesBox.appendChild(
                    div
                );

            }
        );


        messagesBox.scrollTop =
            messagesBox.scrollHeight;

    }


    /* ОТПРАВКА СООБЩЕНИЯ */

    async function sendMessage() {

        if (!currentOrder) {
            return;
        }


        const input =
            document.getElementById(
                "messageInput"
            );


        const button =
            document.getElementById(
                "sendButton"
            );


        const text =
            input.value.trim();


        if (!text) {
            return;
        }


        button.disabled =
            true;


        button.textContent =
            "Отправка...";


        try {

            const response =
                await fetch(

                    "/api/users/" +
                    encodeURIComponent(
                        currentOrder.id
                    ) +
                    "/messages",

                    {

                        method: "POST",


                        headers: {

                            "Content-Type":
                                "application/json"

                        },


                        body:
                            JSON.stringify({

                                text: text,

                                sender: "user"

                            })

                    }

                );


            const result =
                await response.json();


            if (
                !response.ok ||
                result.error
            ) {

                alert(
                    result.error ||
                    "Не удалось отправить сообщение"
                );

                return;

            }


            input.value =
                "";


            lastMessagesJson =
                "";


            await loadOrder();

        } catch (error) {

            console.error(error);

            alert(
                "Ошибка соединения с сервером"
            );

        } finally {

            button.disabled =
                false;


            button.textContent =
                "🚀 Отправить";

        }

    }


    /* ENTER ОТПРАВЛЯЕТ СООБЩЕНИЕ */

    document
        .getElementById(
            "messageInput"
        )
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "Enter"
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


    /* КНОПКА ОТПРАВКИ */

    document
        .getElementById(
            "sendButton"
        )
        .addEventListener(
            "click",
            sendMessage
        );


    /* ЗАЩИТА ОТ HTML */

    function escapeHtml(text) {

        return String(
            text ?? ""
        )

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );

    }


    /* ПЕРВАЯ ЗАГРУЗКА */

    loadOrder();


    /*
    Автоматическое обновление чата.
    Сообщения не будут мигать,
    если ничего не изменилось.
    */

    setInterval(
        loadOrder,
        2000
    );

</script>


</body>
</html>

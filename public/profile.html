<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Мой профиль — RiRobux</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(124,58,237,.25),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 70%,
                    rgba(37,99,235,.22),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #050816,
                    #101636,
                    #09061a
                );
        }


        /* ЗВЁЗДЫ */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background-image:
                radial-gradient(
                    circle,
                    rgba(255,255,255,.8) 1px,
                    transparent 1px
                ),
                radial-gradient(
                    circle,
                    rgba(196,181,253,.6) 1px,
                    transparent 1px
                );

            background-size:
                90px 90px,
                150px 150px;

            background-position:
                0 0,
                50px 70px;

            opacity: .3;

            z-index: -1;
        }


        /* HEADER */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 16px 6%;

            background:
                rgba(8,12,35,.85);

            border-bottom:
                1px solid
                rgba(139,92,246,.35);

            backdrop-filter:
                blur(15px);

            position: sticky;
            top: 0;

            z-index: 100;
        }


        .logo {
            color: white;

            text-decoration: none;

            font-size: 26px;
            font-weight: bold;
        }


        .robux {
            color: #b57cff;
        }


        .back {
            padding: 11px 18px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );

            color: white;
            text-decoration: none;

            font-weight: bold;

            transition: .2s;
        }


        .back:hover {
            transform:
                translateY(-2px);
        }


        /* MAIN */

        main {
            max-width: 950px;

            margin: 40px auto;

            padding: 20px;
        }


        .card {
            padding: 30px;

            border-radius: 25px;

            background:
                rgba(16,20,55,.85);

            border:
                1px solid
                rgba(139,92,246,.35);

            box-shadow:
                0 20px 80px
                rgba(0,0,0,.35);

            backdrop-filter:
                blur(15px);
        }


        h1,
        h2 {
            text-align: center;
        }


        h1 {
            margin-bottom: 30px;
        }


        /* STATS */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin: 25px 0 35px;
        }


        .stat {
            padding: 20px;

            text-align: center;

            border-radius: 18px;

            background:
                rgba(124,58,237,.12);

            border:
                1px solid
                rgba(139,92,246,.2);
        }


        .stat b {
            display: block;

            font-size: 28px;

            color: #c4b5fd;

            margin-bottom: 5px;
        }


        /* ORDERS */

        #orders {
            display: grid;
            gap: 18px;

            margin-top: 25px;
        }


        .order {
            padding: 22px;

            border-radius: 22px;

            background:
                rgba(7,10,30,.72);

            border:
                1px solid
                rgba(139,92,246,.3);

            transition: .2s;
        }


        .order:hover {
            border-color:
                rgba(167,139,250,.6);

            transform:
                translateY(-2px);
        }


        .top {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 18px;
        }


        .status {
            padding: 8px 13px;

            border-radius: 20px;

            background:
                rgba(124,58,237,.22);

            color: #ddd6fe;

            white-space: nowrap;
        }


        /* INFO */

        .info {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;
        }


        .item {
            padding: 13px;

            border-radius: 14px;

            background:
                rgba(124,58,237,.1);

            color: #a8a8bd;

            line-height: 1.6;
        }


        .item strong {
            color: white;
        }


        /* PROGRESS */

        .progress-title {
            margin-top: 22px;

            margin-bottom: 15px;

            font-size: 14px;

            color: #c4b5fd;
        }


        .progress-steps {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 8px;

            position: relative;
        }


        .step {
            position: relative;

            text-align: center;

            font-size: 11px;

            color: #69697d;

            z-index: 1;
        }


        .step-circle {
            width: 32px;
            height: 32px;

            margin:
                0 auto 7px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                rgba(255,255,255,.06);

            border:
                1px solid
                rgba(255,255,255,.1);
        }


        .step.active {
            color: #d8ccff;
        }


        .step.active .step-circle {
            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );

            border-color:
                #a78bfa;

            box-shadow:
                0 0 20px
                rgba(124,58,237,.45);
        }


        .progress-bar {
            width: 100%;

            height: 6px;

            margin-top: 18px;

            border-radius: 20px;

            overflow: hidden;

            background:
                rgba(255,255,255,.07);
        }


        .progress-fill {
            height: 100%;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    #7c3aed,
                    #2563eb
                );

            transition: .4s;
        }


        /* BUTTONS */

        .buttons {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 22px;
        }


        button {
            padding: 12px 16px;

            border: 0;

            border-radius: 12px;

            color: white;

            font-weight: bold;

            cursor: pointer;

            transition: .2s;
        }


        button:hover {
            transform:
                translateY(-2px);
        }


        .chat {
            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );
        }


        .edit {
            background:
                linear-gradient(
                    135deg,
                    #ca8a04,
                    #f59e0b
                );
        }


        .cancel {
            background:
                #dc2626;
        }


        .hide {
            background:
                rgba(255,255,255,.08);

            border:
                1px solid
                rgba(255,255,255,.1);
        }


        .empty {
            padding: 40px;

            text-align: center;

            color: #9898ac;

            border-radius: 20px;

            background:
                rgba(124,58,237,.07);
        }


        /* MODAL */

        .modal {
            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(0,0,0,.7);

            backdrop-filter:
                blur(10px);

            z-index: 1000;
        }


        .modal.active {
            display: flex;
        }


        .modal-box {
            width: 100%;

            max-width: 480px;

            padding: 30px;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    #121735,
                    #090b1d
                );

            border:
                1px solid
                rgba(167,139,250,.4);

            box-shadow:
                0 0 70px
                rgba(124,58,237,.2);
        }


        .modal-box h2 {
            margin-top: 0;

            margin-bottom: 25px;
        }


        .field {
            margin-bottom: 18px;
        }


        .field label {
            display: block;

            margin-bottom: 8px;

            color: #c4b5fd;

            font-size: 14px;
        }


        .field input {
            width: 100%;

            padding: 14px;

            border-radius: 12px;

            border:
                1px solid
                rgba(139,92,246,.3);

            outline: none;

            color: white;

            font-size: 16px;

            background:
                rgba(0,0,0,.25);
        }


        .field input:focus {
            border-color:
                #a78bfa;

            box-shadow:
                0 0 20px
                rgba(124,58,237,.2);
        }


        .modal-buttons {
            display: flex;

            gap: 10px;

            margin-top: 25px;
        }


        .save {
            flex: 1;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );
        }


        .close {
            background:
                rgba(255,255,255,.08);
        }


        /* MOBILE */

        @media (max-width: 650px) {

            header {
                padding: 15px 20px;
            }


            .stats,
            .info {
                grid-template-columns:
                    1fr;
            }


            .progress-steps {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 18px;
            }


            .buttons button {
                width: 100%;
            }


            .top {
                align-items: flex-start;

                flex-direction: column;
            }

        }

    </style>
</head>


<body>


<header>

    <a
        href="index.html"
        class="logo"
    >
        Ri<span class="robux">Robux</span>
    </a>


    <a
        href="index.html"
        class="back"
    >
        ← Главная
    </a>

</header>



<main>

    <div class="card">

        <h1>
            👤 Мой профиль
        </h1>


        <div class="stats">

            <div class="stat">

                <b
                    id="ordersCount"
                >
                    0
                </b>

                🛒 Заказов

            </div>


            <div class="stat">

                <b
                    id="robuxCount"
                >
                    0
                </b>

                💎 Robux

            </div>


            <div class="stat">

                <b
                    id="completedCount"
                >
                    0
                </b>

                🚀 Выполнено

            </div>

        </div>


        <h2>
            🛒 Мои заказы
        </h2>


        <div id="orders">

            <div class="empty">
                Загрузка...
            </div>

        </div>

    </div>

</main>



<!-- МОДАЛЬНОЕ ОКНО -->

<div
    class="modal"
    id="editModal"
>

    <div class="modal-box">

        <h2>
            ✏️ Изменить заказ
        </h2>


        <div class="field">

            <label>
                Roblox Username
            </label>

            <input
                type="text"
                id="editUsername"
            >

        </div>


        <div class="field">

            <label>
                Количество Robux
            </label>

            <input
                type="number"
                id="editRobux"
                min="1"
            >

        </div>


        <div class="modal-buttons">

            <button
                class="save"
                onclick="saveOrder()"
            >
                Сохранить
            </button>


            <button
                class="close"
                onclick="closeModal()"
            >
                Отмена
            </button>

        </div>

    </div>

</div>



<script>


/* ID ПРОФИЛЯ */

const profileId =
    localStorage.getItem(
        "rirobuxProfileId"
    );


let editingOrderId =
    null;



/* ЗАГРУЗКА ЗАКАЗОВ */

async function loadOrders() {

    const box =
        document.getElementById(
            "orders"
        );


    if (!profileId) {

        box.innerHTML =
            `
            <div class="empty">
                🚀 У тебя пока нет заказов
            </div>
            `;

        updateStats([]);

        return;
    }


    try {

        const response =
            await fetch(
                "/api/profiles/" +
                encodeURIComponent(profileId) +
                "/orders"
            );


        if (!response.ok) {

            throw new Error(
                "Ошибка загрузки"
            );

        }


        const allOrders =
            await response.json();


        const orders =
            allOrders.filter(
                order =>
                    !order.hiddenForProfile
            );


        renderOrders(
            orders
        );


    } catch (error) {

        console.error(error);

        box.innerHTML =
            `
            <div class="empty">
                ⚠ Ошибка загрузки заказов
            </div>
            `;

    }

}



/* СТАТИСТИКА */

function updateStats(orders) {

    document.getElementById(
        "ordersCount"
    ).textContent =
        orders.length;


    document.getElementById(
        "robuxCount"
    ).textContent =
        orders
            .reduce(
                (
                    sum,
                    order
                ) =>
                    sum +
                    Number(
                        order.robux ||
                        0
                    ),
                0
            )
            .toLocaleString(
                "ru-RU"
            );


    document.getElementById(
        "completedCount"
    ).textContent =
        orders.filter(
            order =>
                order.status ===
                "Выполнено"
        ).length;

}



/* ПОКАЗ ЗАКАЗОВ */

function renderOrders(orders) {

    updateStats(
        orders
    );


    const box =
        document.getElementById(
            "orders"
        );


    if (!orders.length) {

        box.innerHTML =
            `
            <div class="empty">
                🚀 У тебя пока нет активных заказов
            </div>
            `;

        return;

    }


    box.innerHTML =
        "";


    orders
        .slice()
        .reverse()
        .forEach(
            order => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "order";


                const canEdit =
                    order.status ===
                    "Новая заявка";


                const progress =
                    getProgress(
                        order.status
                    );


                div.innerHTML =
                    `

                    <div class="top">

                        <strong>

                            🚀 Заказ #${
                                escapeHtml(
                                    order.orderNumber ||
                                    "—"
                                )
                            }

                        </strong>


                        <span class="status">

                            ${
                                escapeHtml(
                                    order.status
                                )
                            }

                        </span>

                    </div>



                    <div class="info">

                        <div class="item">

                            👤 Username

                            <br>

                            <strong>

                                ${
                                    escapeHtml(
                                        order.username
                                    )
                                }

                            </strong>

                        </div>


                        <div class="item">

                            💎 Robux

                            <br>

                            <strong>

                                ${
                                    Number(
                                        order.robux
                                    ).toLocaleString(
                                        "ru-RU"
                                    )
                                }

                            </strong>

                        </div>


                        <div class="item">

                            💰 Цена

                            <br>

                            <strong>

                                ${
                                    Number(
                                        order.price ||
                                        0
                                    ).toLocaleString(
                                        "ru-RU"
                                    )
                                } ₽

                            </strong>

                        </div>


                        <div class="item">

                            📅 Дата

                            <br>

                            <strong>

                                ${
                                    escapeHtml(
                                        order.createdAt ||
                                        "—"
                                    )
                                }

                            </strong>

                        </div>

                    </div>



                    <div class="progress-title">

                        📦 Статус выполнения

                    </div>


                    <div class="progress-steps">

                        ${
                            progressStep(
                                "📝",
                                "Заявка",
                                progress >= 1
                            )
                        }

                        ${
                            progressStep(
                                "⏳",
                                "В работе",
                                progress >= 2
                            )
                        }

                        ${
                            progressStep(
                                "🚀",
                                "Выполняется",
                                progress >= 3
                            )
                        }

                        ${
                            progressStep(
                                "✅",
                                "Готово",
                                progress >= 4
                            )
                        }

                    </div>


                    <div class="progress-bar">

                        <div
                            class="progress-fill"
                            style="
                                width:
                                ${
                                    getProgressWidth(
                                        progress
                                    )
                                }
                            "
                        ></div>

                    </div>



                    <div class="buttons">


                        <button
                            class="chat"
                            onclick="
                                openChat(
                                    '${order.id}'
                                )
                            "
                        >

                            💬 Чат с продавцом

                        </button>



                        ${
                            canEdit

                            ?

                            `

                            <button
                                class="edit"
                                onclick="
                                    editOrder(
                                        '${order.id}',
                                        '${escapeAttribute(order.username)}',
                                        ${Number(order.robux)}
                                    )
                                "
                            >

                                ✏️ Изменить

                            </button>


                            <button
                                class="cancel"
                                onclick="
                                    cancelOrder(
                                        '${order.id}'
                                    )
                                "
                            >

                                ❌ Отменить

                            </button>

                            `

                            :

                            ""

                        }


                        <button
                            class="hide"
                            onclick="
                                hideOrder(
                                    '${order.id}'
                                )
                            "
                        >

                            🗑 Убрать

                        </button>


                    </div>

                    `;


                box.appendChild(
                    div
                );

            }
        );

}



/* ШАГ ПРОГРЕССА */

function progressStep(
    icon,
    text,
    active
) {

    return `

        <div
            class="
                step
                ${
                    active
                    ? "active"
                    : ""
                }
            "
        >

            <div class="step-circle">

                ${icon}

            </div>

            ${text}

        </div>

    `;

}



/* УРОВЕНЬ ПРОГРЕССА */

function getProgress(status) {

    switch (
        status
    ) {

        case "Новая заявка":
            return 1;

        case "В работе":
            return 2;

        case "Выполняется":
            return 3;

        case "Выполнено":
            return 4;

        default:
            return 0;

    }

}



/* ШИРИНА ПРОГРЕСС-БАРА */

function getProgressWidth(
    progress
) {

    switch (
        progress
    ) {

        case 1:
            return "25%";

        case 2:
            return "50%";

        case 3:
            return "75%";

        case 4:
            return "100%";

        default:
            return "0%";

    }

}



/* ОТКРЫТЬ ЧАТ */

function openChat(orderId) {

    window.location.href =
        "chat.html?order=" +
        encodeURIComponent(
            orderId
        );

}



/* ОТКРЫТЬ РЕДАКТИРОВАНИЕ */

function editOrder(
    orderId,
    username,
    robux
) {

    editingOrderId =
        orderId;


    document.getElementById(
        "editUsername"
    ).value =
        username;


    document.getElementById(
        "editRobux"
    ).value =
        robux;


    document
        .getElementById(
            "editModal"
        )
        .classList
        .add(
            "active"
        );

}



/* ЗАКРЫТЬ ОКНО */

function closeModal() {

    editingOrderId =
        null;


    document
        .getElementById(
            "editModal"
        )
        .classList
        .remove(
            "active"
        );

}



/* СОХРАНИТЬ ИЗМЕНЕНИЯ */

async function saveOrder() {

    if (!editingOrderId) {

        return;

    }


    const username =
        document
            .getElementById(
                "editUsername"
            )
            .value
            .trim();


    const robux =
        Number(
            document
                .getElementById(
                    "editRobux"
                )
                .value
        );


    if (!username) {

        alert(
            "Введите Roblox Username"
        );

        return;

    }


    if (
        !robux ||
        robux < 1
    ) {

        alert(
            "Введите правильное количество Robux"
        );

        return;

    }


    try {

        const response =
            await fetch(

                "/api/users/" +
                encodeURIComponent(
                    editingOrderId
                ),

                {

                    method:
                        "PATCH",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            {

                                username:
                                    username,

                                robux:
                                    robux

                            }
                        )

                }

            );


        const result =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                result.error ||
                "Ошибка изменения заказа"
            );

        }


        closeModal();


        loadOrders();


    } catch (error) {

        alert(
            error.message ||
            "Ошибка соединения"
        );

    }

}



/* ОТМЕНИТЬ ЗАКАЗ */

async function cancelOrder(
    orderId
) {

    if (
        !confirm(
            "Точно отменить эту заявку?"
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(

                "/api/users/" +
                encodeURIComponent(
                    orderId
                ) +
                "/cancel",

                {

                    method:
                        "POST"

                }

            );


        const result =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                result.error ||
                "Не удалось отменить заявку"
            );

        }


        loadOrders();


    } catch (error) {

        alert(
            error.message ||
            "Ошибка соединения"
        );

    }

}



/* СКРЫТЬ ЗАКАЗ */

async function hideOrder(
    orderId
) {

    if (
        !confirm(
            "Убрать этот заказ из профиля?"
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(

                "/api/users/" +
                encodeURIComponent(
                    orderId
                ) +
                "/hide",

                {

                    method:
                        "POST"

                }

            );


        const result =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                result.error ||
                "Не удалось убрать заказ"
            );

        }


        loadOrders();


    } catch (error) {

        alert(
            error.message ||
            "Ошибка соединения"
        );

    }

}



/* ЗАЩИТА ОТ HTML */

function escapeHtml(
    text
) {

    return String(
        text ?? ""
    )

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* ДЛЯ АТРИБУТОВ */

function escapeAttribute(
    text
) {

    return String(
        text ?? ""
    )

        .replaceAll(
            "\\",
            "\\\\"
        )

        .replaceAll(
            "'",
            "\\'"
        );

}



/* ЗАГРУЗКА */

loadOrders();


/* ОБНОВЛЕНИЕ КАЖДЫЕ 3 СЕКУНДЫ */

setInterval(
    loadOrders,
    3000
);


</script>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RiRobux — Вход для администратора</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(124, 58, 237, 0.35),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(37, 99, 235, 0.3),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #050816,
                    #101636,
                    #09061a
                );
        }


        /* ЗВЁЗДЫ */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background-image:
                radial-gradient(
                    circle,
                    white 1px,
                    transparent 1.5px
                ),
                radial-gradient(
                    circle,
                    rgba(196, 181, 253, 0.8) 1px,
                    transparent 1.5px
                );

            background-size:
                80px 80px,
                130px 130px;

            opacity: 0.5;

            animation:
                starsMove 25s linear infinite;
        }


        @keyframes starsMove {

            from {
                background-position:
                    0 0,
                    40px 60px;
            }

            to {
                background-position:
                    80px 120px,
                    120px 180px;
            }

        }


        .login-card {
            position: relative;
            z-index: 1;

            width: min(
                420px,
                calc(100% - 40px)
            );

            padding: 40px 32px;

            border-radius: 28px;

            text-align: center;

            background:
                rgba(16, 20, 55, 0.85);

            border:
                1px solid
                rgba(139, 92, 246, 0.45);

            box-shadow:
                0 0 50px
                rgba(124, 58, 237, 0.3);

            backdrop-filter:
                blur(20px);
        }


        .icon {
            font-size: 65px;

            margin-bottom: 10px;

            filter:
                drop-shadow(
                    0 0 20px
                    rgba(139, 92, 246, 0.7)
                );
        }


        h1 {
            margin: 10px 0;

            font-size: 30px;

            text-shadow:
                0 0 20px
                rgba(139, 92, 246, 0.5);
        }


        .subtitle {
            color: #b8c1e0;

            margin-bottom: 28px;

            line-height: 1.5;
        }


        input {
            width: 100%;

            padding: 15px;

            border-radius: 14px;

            border:
                1px solid
                rgba(139, 92, 246, 0.5);

            background:
                rgba(7, 10, 30, 0.75);

            color: white;

            font-size: 17px;

            outline: none;

            transition:
                0.2s;
        }


        input:focus {
            border-color: #c4b5fd;

            box-shadow:
                0 0 20px
                rgba(124, 58, 237, 0.35);
        }


        button {
            width: 100%;

            margin-top: 15px;

            padding: 15px;

            border: none;

            border-radius: 14px;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );

            box-shadow:
                0 0 25px
                rgba(124, 58, 237, 0.35);

            transition:
                0.2s;
        }


        button:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 0 35px
                rgba(124, 58, 237, 0.6);
        }


        .error {
            min-height: 24px;

            margin-top: 15px;

            color: #ff8ba7;

            font-weight: bold;
        }


        .logo {
            margin-top: 25px;

            font-size: 18px;

            font-weight: bold;

            color: white;
        }


        .logo span {
            color: #b57cff;
        }


        @media (
            max-width: 500px
        ) {

            .login-card {
                padding:
                    32px 22px;
            }

        }

    </style>
</head>


<body>

    <div class="login-card">

        <div class="icon">
            🛡️
        </div>


        <h1>
            Вход для администратора
        </h1>


        <div class="subtitle">
            RiRobux Admin Panel 🌌
        </div>


        <input
            type="password"
            id="password"
            placeholder="Введите пароль"
        >


        <button
            onclick="login()"
        >
            🚀 Войти в админ-панель
        </button>


        <div
            class="error"
            id="error"
        >
        </div>


        <div class="logo">
            Ri<span>Robux</span>
        </div>

    </div>


<script>

    const ADMIN_PASSWORD =
        "09876543211234567890a";


    function login() {

        const password =
            document
                .getElementById(
                    "password"
                )
                .value;


        const error =
            document.getElementById(
                "error"
            );


        if (
            password ===
            ADMIN_PASSWORD
        ) {

            sessionStorage.setItem(
                "rirobuxAdmin",
                "true"
            );


            window.location.href =
                "admin.html";

        } else {

            error.textContent =
                "❌ Неверный пароль";

        }

    }


    document
        .getElementById(
            "password"
        )
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "Enter"
                ) {

                    login();

                }

            }
        );

</script>

</body>
</html>
